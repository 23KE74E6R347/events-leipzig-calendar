name: Update Leipzig Calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Build Calendar
      - name: Build calendar
        run: timeout 120s python build_calendar.py

      - name: Commit Updated Calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events-leipzig.ics
          if git diff --cached --quiet; then
            echo "Calendar Unchanged."
          else
            git commit -m "Update Leipzig Event Calendar"
            git push
          fi
